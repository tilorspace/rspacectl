[tool.poetry]
name = "rspacectl"
version = "0.2.0"
description = "Command-line interface for RSpace ELN and Inventory"
authors = ["ResearchSpace <info@researchspace.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/rspace-os/rspacectl"
repository = "https://github.com/rspace-os/rspacectl"
keywords = ["rspace", "eln", "inventory", "cli", "laboratory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
packages = [{include = "rspacectl"}]

[tool.poetry.dependencies]
python = "^3.11"
typer = ">=0.9"
rich = ">=13.0"
rspace-client = ">=2.7.4"
python-dotenv = ">=1.0"
keyring = {version = ">=24.0", optional = true}

[tool.poetry.extras]
keychain = ["keyring"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-mock = ">=3.10"
ruff = "0.17.3"

[tool.poetry.scripts]
rspace = "rspacectl.app:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# B008: Typer declares options as function-call defaults.
# E501: ruff format handles line length; long strings are left alone.
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# Imports the command modules so app.py can register them.
"rspacectl/commands/__init__.py" = ["F401"]
